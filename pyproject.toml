[project]
name = "prwords"
version = "3.0.0"
description = "Pull request description, size, speed and label analysis, with a pre-specified test of AI-linked PR size"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.8", "requests>=2.31", "tabulate>=0.9"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
prwords = "prwords.cli:main"

[tool.setuptools]
packages = ["prwords"]
